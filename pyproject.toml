[project]
name = "rc-evals"
version = "0.1.0"
description = "Eval harness and MCP server for the RC tagging pipeline"
readme = "README.md"
authors = [
    { name = "Eliot Shepard", email = "eshepard@slower.net" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
rc-evals = "rc_evals:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
